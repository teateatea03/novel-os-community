name: Contact the maintainer
description: Arrange licensing or a private reporting channel without sensitive details
title: "[Contact] "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include income, financial statements,
        payment records, transaction hashes, credentials, private manuscripts,
        security exploit details, or personal contact information.
        Ask only to arrange an appropriate private channel with the maintainer.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Commercial license version acknowledgment and private reporting
        - Private security or privacy reporting channel
        - Other maintainer contact
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public information only
      options:
        - label: I have not included private, financial, or security-sensitive details
          required: true
