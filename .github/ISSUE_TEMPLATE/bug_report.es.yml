name: Informe de error (Español)
description: Informar de un defecto reproducible de Novel OS
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: No incluya manuscritos privados, sesiones, datos personales, credenciales ni investigación
      inédita.
- type: textarea
  id: summary
  attributes:
    label: Resumen
    description: ¿Qué falló y qué esperaba?
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Reproducción mínima
    description: Utilice únicamente datos sintéticos.
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Commit o versión
- type: textarea
  id: environment
  attributes:
    label: Entorno
    description: Sistema operativo, versión de Python e integraciones opcionales; elimine nombres de usuario
      y rutas locales.
- type: checkboxes
  id: privacy
  attributes:
    label: Confirmación de privacidad
    options:
    - label: He eliminado material creativo privado, datos personales, credenciales y puntos de acceso
        locales.
      required: true
