name: 不具合報告（日本語）
description: 再現可能な Novel OS の不具合を報告します
title: '[Bug]: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 非公開原稿、セッション、個人情報、認証情報、未発表の研究を含めないでください。
- type: textarea
  id: summary
  attributes:
    label: 概要
    description: 何が失敗し、何を期待しましたか。
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 最小再現手順
    description: 合成データのみを使用してください。
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: コミットまたはバージョン
- type: textarea
  id: environment
  attributes:
    label: 環境
    description: OS、Python バージョン、任意の連携を示してください。ユーザー名とローカルパスは除去してください。
- type: checkboxes
  id: privacy
  attributes:
    label: プライバシーの確認
    options:
    - label: 私的な創作素材、個人情報、認証情報、ローカルエンドポイントを除去しました。
      required: true
