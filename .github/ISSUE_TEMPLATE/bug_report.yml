name: Bug report / 錯誤回報
description: Report a reproducible Novel OS defect / 回報可重現的 Novel OS 問題
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private manuscripts, sessions, personal data, credentials, or unpublished research. 請勿包含私人原稿、工作階段、個資、憑證或未公開研究。"
  - type: textarea
    id: summary
    attributes:
      label: Summary / 摘要
      description: What failed, and what did you expect? 哪裡出錯？預期結果為何？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小重現步驟
      description: Use synthetic data only. 僅使用合成資料。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version / 提交或版本
  - type: textarea
    id: environment
    attributes:
      label: Environment / 環境
      description: OS, Python version, and optional integrations; remove usernames and local paths. 請列出作業系統、Python 版本及選用整合；移除使用者名稱與本機路徑。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隱私確認
      options:
        - label: I removed private creative material, personal data, credentials, and local endpoints. 我已移除私人創作、個資、憑證及本機端點。
          required: true
